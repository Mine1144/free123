[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "screen-thai"
version = "0.1.0"
description = "Native Windows screen translation overlay with local or cloud AI"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.7,<7", "mss>=9,<11", "Pillow>=10,<13", "numpy>=1.26,<3",
  "rapidocr-onnxruntime>=1.4.4,<2", "httpx>=0.27,<1", "keyring>=25,<26"
]

[project.optional-dependencies]
# Face landmarks (expression cues, stable identity matching). mediapipe pins numpy<2 and pulls
# opencv-contrib-python; without it the app falls back to OpenCV-only face detection or to off.
faces = ["mediapipe==0.10.21"]
dev = ["pytest>=8,<9", "ruff>=0.9,<1", "pyinstaller>=6.10,<7"]

[project.scripts]
screen-thai = "screen_thai.app:main"

[tool.setuptools.packages.find]
include = ["screen_thai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
